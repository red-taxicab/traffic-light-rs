[package]
name = "traffic-light-macros"
version = "0.1.2"
authors = ["red-taxicab <gabriel.lloyd.medlock@gmail.com>"]
edition = "2024"
description = "Macros for another single-threaded blocking asynchronous executor in rust."
documentation = "https://docs.rs/traffic-light-macros"
readme = "README.md"
repository = "https://github.com/red-taxicab/traffic-light-rs"
license = "MIT OR Apache-2.0"
keywords = ["macros", "single-threaded", "blocking", "asynchronous", "executor"]
categories = ["asynchronous"]

[lib]
proc-macro = true

[dependencies]
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full"] }

[dev-dependencies]
traffic-light = { path = "../traffic-light", features = ["macros"] }
